<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CatSpell</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="text-center mt-5">
    <div class="container">
        <h1>🐱✨ CatSpell</h1>

        <form method="post" action="/cast">
            <textarea name="phrase" class="form-control" rows="3" placeholder="Enter a phrase to cast a cat spell..."></textarea>
            <button type="submit" class="btn btn-warning mt-3">Cast Spell</button>
        </form>

        <div th:if="${spell}" class="mt-4">
            <h3>🔮 Your Cat Spell:</h3>
            <blockquote class="blockquote"><p th:text="${spell}"></p></blockquote>
            <p class="text-muted">🐾 Fun Cat Fact: <span th:text="${catFact}"></span></p>
        </div>
    </div>
</body>
</html>
